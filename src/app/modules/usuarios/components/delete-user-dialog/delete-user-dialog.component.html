<h2 mat-dialog-title>Excluir usuário?</h2>
<mat-dialog-content>
    <p>
        A conta de <strong>{{ data.user.name }}</strong> ({{ data.user.email }}) será excluída
        permanentemente.
    </p>
    <p>Esta ação não pode ser desfeita.</p>
    @if (data.isCurrentUser) {
        <p>Você está excluindo sua própria conta e sairá da aplicação.</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close cdkFocusInitial>Cancelar</button>
    <button mat-flat-button class="delete-button" [mat-dialog-close]="result">
        Excluir usuário
    </button>
</mat-dialog-actions>
