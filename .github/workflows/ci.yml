name: CI

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test -- --watch=false

            - run: npm run build
